name: Noir CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: nargo test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - v1.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: noir-lang/noirup@bedac8fbe6a059177c35e565f9f76db54a795976 # v0.1.5
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Test hash_utils
        run: nargo test
        working-directory: hash_utils
      - name: Test poseidon
        run: nargo test
        working-directory: poseidon
      - name: Test poseidon2
        run: nargo test
        working-directory: poseidon2
      - name: Test EdDSA-Poseidon2
        run: nargo test
        working-directory: eddsa_poseidon2
